[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "word-addin-copilot-public"
version = "0.1.0"
license = "LicenseRef-Personal-and-Legal-Professional-Use"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Локальный хост боковой панели Word для анализа документов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "cryptography>=42",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "markitdown[docx,pdf]>=0.0.2",
    "olefile>=0.47",
    "striprtf>=0.0.30",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["host*", "tray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
